name: One-time verified Cute Chat0.4.16 asset upload
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-cute-chat-0.4.16
  cancel-in-progress: false
jobs:
  upload:
    if: github.repository == 'xjitroy/Cute-Chat-E2EE-P2P-Encrypted'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify pinned public artifacts and fill only the authorized draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,subprocess,urllib.request
          from datetime import datetime,timezone
          from pathlib import Path
          assert datetime.now(timezone.utc)<datetime.fromisoformat('2026-10-14T13:06:41.979324+00:00'), 'One-time publication window expired'
          repo='xjitroy/Cute-Chat-E2EE-P2P-Encrypted'
          tag='cute-chat-0.4.16'
          commit='a37593789d8f946a067aefdeda2a9abde5a4fdb2'
          files=[{'name': 'CHECKSUMS.sha256', 'bytes': 589, 'sha256': '14e3f8c05effd0e48cfa7b79f3ef05ce4cd89dc252625f699663bcc0df6d60ce'}, {'name': 'Cute-Chat-0.4.16-Source.zip', 'bytes': 1341051, 'sha256': '54f9ae267d48cdc971cbd199c409ac12f65053547e0946f3bff723834be1caef'}, {'name': 'Cute-Chat-0.4.16-normal.apk', 'bytes': 79635984, 'sha256': '3875590ae2c19188cf2da4be2cef4fa3a8e74beba4690f342b1845baec9d4847'}, {'name': 'PRIVACY.md', 'bytes': 1347, 'sha256': 'c701a6edea7c09412936e7d272791dd92328b0aa949a584b5683b1947d476506'}, {'name': 'README.md', 'bytes': 7828, 'sha256': '52a94d7c19b805fadd92e9ee38c5835b9b0f606ae36ffd960df89d06fdb0aa53'}, {'name': 'SECURITY.md', 'bytes': 1838, 'sha256': 'dc630bb43e1f1f8c0ac5004072806f46c520d13f76ecb2b3c4b31d9e5a3de65d'}, {'name': 'VALIDATION.json', 'bytes': 1576, 'sha256': '86903ed1c93ea29c9e2388df16b9ce3b889841e90d874cea3c617767836c0639'}, {'name': 'cute-chat-update.json', 'bytes': 367, 'sha256': 'b801a9b11434dc61a5fd5a844a3839a9c50d8bcbd440f8f17bb216fefd313a18'}]
          release=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/releases/412621660'],text=True))
          assert release['id']==412621660 and release['tag_name']==tag and release['draft'] is True and release['prerelease'] is False, 'Only the exact authorized unpublished draft may be populated'
          folder=Path('release-assets');folder.mkdir()
          for f in files:
           url=f"https://raw.githubusercontent.com/{repo}/{commit}/App/0.4.16/{f['name']}"
           path=folder/f['name'];digest=hashlib.sha256();size=0
           with urllib.request.urlopen(url,timeout=90) as response,path.open('wb') as output:
            while True:
             chunk=response.read(1024*1024)
             if not chunk:break
             size+=len(chunk);assert size<=f['bytes'];digest.update(chunk);output.write(chunk)
           assert size==f['bytes'] and digest.hexdigest()==f['sha256'],f['name']
           subprocess.run(['gh','release','upload',tag,'--repo',repo,str(path),'--clobber'],check=True)
           print(f"Verified and uploaded {f['name']}: {size} bytes",flush=True)
          print('Exact eight verified assets uploaded; no release publication or other repository writes performed.')
          PY
