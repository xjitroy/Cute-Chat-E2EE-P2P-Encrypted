name: One-time verified Cute Chat0.4.15 asset upload
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-cute-chat-0.4.15
  cancel-in-progress: false
jobs:
  upload:
    if: github.repository == 'xjitroy/Cute-Chat-E2EE-P2P-Encrypted'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify pinned public artifacts and fill only the authorized draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,subprocess,urllib.request
          from datetime import datetime,timezone
          from pathlib import Path
          assert datetime.now(timezone.utc)<datetime.fromisoformat('2026-10-14T11:31:33.032263+00:00'), 'One-time publication window expired'
          repo='xjitroy/Cute-Chat-E2EE-P2P-Encrypted'
          tag='cute-chat-0.4.15'
          commit='ab74d603cd6dd0849854db0d796c708dc37d293e'
          files=[{'name': 'CHECKSUMS.sha256', 'bytes': 589, 'sha256': '995fde32d6eb149652db3bf37e992669412ff3981a0c8c4881970244cc44a621'}, {'name': 'Cute-Chat-0.4.15-Source.zip', 'bytes': 1333348, 'sha256': '85f0c220a6249923f3c937c79fa321d4b45ea9f024a86476bbca94178f93d5b0'}, {'name': 'Cute-Chat-0.4.15-normal.apk', 'bytes': 79635984, 'sha256': 'aaa501c672b3b3c50e9f0e7aba7ac8c91d9a13aa9c9447e7ff235f3e1e70f9db'}, {'name': 'PRIVACY.md', 'bytes': 1347, 'sha256': 'c701a6edea7c09412936e7d272791dd92328b0aa949a584b5683b1947d476506'}, {'name': 'README.md', 'bytes': 6319, 'sha256': '94192f8869060d265085a5a5db38e0ac80b626de1e56a1024bc5db34d817b703'}, {'name': 'SECURITY.md', 'bytes': 1838, 'sha256': 'dc630bb43e1f1f8c0ac5004072806f46c520d13f76ecb2b3c4b31d9e5a3de65d'}, {'name': 'VALIDATION.json', 'bytes': 1589, 'sha256': '26e5414e5535a09c8a97d6b24699cfc11b3a4c1c58c4790a6364c81159032e13'}, {'name': 'cute-chat-update.json', 'bytes': 367, 'sha256': '318c81da9682d4778bafef80f1d80714ae2eb2ab28027e54f0d6f7b8588dc4c7'}]
          release=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/releases/412542083'],text=True))
          assert release['id']==412542083 and release['tag_name']==tag and release['draft'] is True and release['prerelease'] is False, 'Only the exact authorized unpublished draft may be populated'
          folder=Path('release-assets');folder.mkdir()
          for f in files:
           url=f"https://raw.githubusercontent.com/{repo}/{commit}/App/0.4.15/{f['name']}"
           path=folder/f['name'];digest=hashlib.sha256();size=0
           with urllib.request.urlopen(url,timeout=90) as response,path.open('wb') as output:
            while True:
             chunk=response.read(1024*1024)
             if not chunk:break
             size+=len(chunk);assert size<=f['bytes'];digest.update(chunk);output.write(chunk)
           assert size==f['bytes'] and digest.hexdigest()==f['sha256'],f['name']
           subprocess.run(['gh','release','upload',tag,'--repo',repo,str(path),'--clobber'],check=True)
           print(f"Verified and uploaded {f['name']}: {size} bytes",flush=True)
          print('Exact eight verified assets uploaded; no release publication or other repository writes performed.')
          PY
